name: Deploy

on:
  push:
    branches:
      - develop

concurrency:
  group: deploy-develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    permissions:
      contents: read
    env:
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '~/new-api' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve deployment image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="$(TZ=Asia/Shanghai date +%Y%m%d)"
          source_image="new-api:${GITHUB_SHA}"
          image_archive="new-api-deploy.tar"

          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "source=${source_image}" >> "$GITHUB_OUTPUT"
          echo "archive=${image_archive}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.image.outputs.source }}
          cache-from: type=gha,scope=deploy
          cache-to: type=gha,mode=max,scope=deploy

      - name: Package deployment image
        shell: bash
        run: |
          docker save \
            --output "${{ steps.image.outputs.archive }}" \
            "${{ steps.image.outputs.source }}"

      - name: Upload deployment image
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 30m
          source: ${{ steps.image.outputs.archive }}
          target: /tmp
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ env.DEPLOY_PORT }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            image_archive="/tmp/${{ steps.image.outputs.archive }}"
            trap 'rm -f "$image_archive"' EXIT

            cd ${{ env.DEPLOY_PATH }}
            git fetch origin
            git reset --hard origin/develop
            ./start.sh deploy-image \
              "$image_archive" \
              "${{ steps.image.outputs.tag }}" \
              "${{ steps.image.outputs.source }}"
